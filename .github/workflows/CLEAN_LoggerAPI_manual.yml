# Workflow to clean out the directory where a deleted branch's files were deployed by CI
name: Manually Cleanup Dead Branch Tag - LoggerAPI
run-name: ${{ format('{0} - {1}', github.workflow, github.event_name == 'delete' && github.event.ref || 'Manual Run') }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to be removed from the repo"
        required: true
        default: "['some-tag']"
    
jobs:
  branch_delete:
    name: Cleanup LoggerAPI Images
    runs-on: ubuntu-24.04
    permissions:
      packages: write # scope permissions within GH to managing packages
    strategy:
      matrix:
        tag: ${{ FromJson(github.event.inputs.tag) }}
      fail-fast: false # we don't want to cancel just because one game fails.
      max-parallel: 3
    
    steps:
    - name: Announce cleanup
      run: echo "Removing images from tag ${{matrix.tag}}"
    
    # 1. Remove Image from GitHub

    - name: Remove Image from Repo
      uses: dataaxiom/ghcr-cleanup-action@v1.2.2
      with:
        delete-tags: ${{ matrix.tag }}

  clean_untagged:
    name: Cleanup Untagged LoggerAPI Images
    runs-on: ubuntu-24.04
    permissions:
      packages: write # scope permissions within GH to managing packages

    steps:
    - name: Clean any other Untagged Images from Repo
      uses: dataaxiom/ghcr-cleanup-action@v1.2.2
